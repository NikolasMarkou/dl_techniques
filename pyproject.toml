[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dl_techniques"
version = "0.1.0"
description = "A versatile library of advanced deep learning techniques for Keras/TensorFlow."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name="Nikolas Markou", email="nikolasmarkou@gmail.com" }
]
requires-python = ">=3.11"

# These are your core runtime dependencies:
dependencies = [
    "tensorflow==2.18.0",
    "keras>=3.8.0,<4.0",
    "numpy>=1.22,<3.0",
    "matplotlib>=3.10,<4.0",
    "seaborn>=0.13.2,<1.0",
    "scipy>=1.15.1,<2.0",
    "scikit-learn>=1.6.1,<2.0",
    "pandas>=2.2.3,<3.0",
    "tqdm"
]

# Trove classifiers (optional but recommended)
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]

# Optional groups of extra dependencies for dev/test/docs
[project.optional-dependencies]
dev = [
    "twine",
    "build",
    "pytest",
    "pytest-cov",
    "pylint",
    "pre-commit"
]
# Web GUIs under src/applications/ (e.g. anomaly_detection). The library core
# does not require these — only the application front-ends do. streamlit-webrtc
# powers the live-webcam anomaly stream (pulls aiortc + PyAV).
apps = [
    "streamlit>=1.40,<2.0",
    "streamlit-webrtc>=0.62,<1.0"
]
# Tokenizer/dataset-loader modules import these at module level:
# dl_techniques/utils/tokenizer.py, models/language/colbert/tokenization.py
# (tiktoken); datasets/{nlp,universal_dataset_loader}.py (datasets);
# datasets/vision/{coco,imagenet}.py (tensorflow-datasets);
# datasets/vision/coco_multitask_local.py (Pillow); datasets/time_series/utils.py
# (requests). The core install does not need them; importing one of those
# specific modules without this extra raises ModuleNotFoundError.
data = [
    "tiktoken",
    "datasets",
    "tensorflow-datasets",
    "Pillow",
    "requests"
]

[tool.setuptools]
# Tells setuptools the source code is in src/
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
# Actually find packages in these directories
where = ["src"]
# Only ship the core library. applications/ and train/ live in the same repo
# but are not part of the redistributable dl_techniques package.
include = ["dl_techniques*"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
# Registered so the markers below stop emitting PytestUnknownMarkWarning.
# NOTE: registration is documentation only -- there is deliberately no
# `addopts = -m "not slow"` here, so marking a test `slow` does NOT keep it out
# of a default run. A test that must not run by default needs its own opt-in
# skipif (see tests/test_train/test_ntm/test_ntm_learnability.py).
markers = [
    "slow: takes more than a few seconds; usually needs a GPU",
    "integration: exercises several components together rather than one unit",
]

# R-038 closure -- plan-2026-08-22T035419-a11304c8 / D-250.
#
# `error::UserWarning` is the DEFAULT, and it is the point: a UserWarning this
# repo did not deliberately provoke is a defect, and the nine root causes that
# R-038 measured (missing `build()`, save-before-optimizer-built, Keras-2
# `input_shape=` kwargs, `plt.show()` in library code, a Q-head that never
# trained, a KAN whose control points were decorative, ...) were all invisible
# until this line existed.
#
# THE RULE FOR ADDING AN ENTRY BELOW. A warning our own code emits, or that a
# single test provokes, does NOT belong here. It belongs either in a
# `pytest.warns(...)` block (when the warning IS the subject) or behind a
# module-scoped `pytestmark = [pytest.mark.filterwarnings("ignore:...")]` in the
# provoking test file, with a comment naming the family -- that keeps the rest
# of the tree loud. Roughly 45 test modules carry such a mark; grep
# `filterwarnings` under `tests/` to see them.
#
# An entry is only allowed here when the family is genuinely tree-wide AND a
# STRICTLY STRONGER standing instrument already covers what the warning would
# have told us. Both of those must be stated in the entry's comment.
#
# RE-MEASURED IN FULL 2026-08-23 -- plan-2026-08-23T091307-9a110062 / D-602.
# Every entry was removed one family at a time and the resulting config run over
# 24 targets. Result: the list went from FIVE ignores to THREE. The two Keras
# `build()` spellings are gone -- their root cause was fixed by this plan and
# they now emit ZERO times across 11,600+ tests. The three survivors were each
# re-measured firing, and their per-entry comments now carry the node ids and
# counts observed on that date rather than the ones they were admitted with.
# The stated cap is TWO; this is THREE, and the honest reason it is not two is
# that TWO of the three are emitted by TensorFlow itself in situations TF
# documents as unavoidable, leaving exactly ONE entry that this repository could
# in principle drive to zero (the gradients family, whose 20 measured emissions
# are all by-design-inert components covered by the gradient-flow oracle).
filterwarnings = [
    "error::UserWarning",

    # Keras `optimizers/base_optimizer.py:774`, 70 node ids over 18+ packages.
    # "Gradients do not exist for variables [...]". MEASURED (R-038 step 3):
    # 62 of the 70 are components that are inert BY DESIGN under the mode the
    # test runs -- SAM's prompt-conditional mask encoder, SAM2's memory bank on
    # the image path, SAM3's segmentation head under `include_masks=False`,
    # BEiT's MIM mask token inside a classifier, video-JEPA's tube mask token
    # outside training, BLT's entropy model when patch ids are supplied -- each
    # carrying an in-source ALWAYS CREATE / CONDITIONALLY USE comment. The
    # STRONGER instrument is `tests/test_models/gradient_flow_oracle.py`
    # (`assert_gradients_reach_every_trainable_weight`), adopted by 62 model
    # packages: it convicts identically-ZERO gradients the warning cannot see,
    # its `expect_zero=` waivers are pinned BY NAME, and an obsolete or stale
    # waiver fails loudly. Do NOT read this entry as "dead weights are fine" --
    # read it as "the oracle, not the warning, is what proves they are not".
    # RE-MEASURED 2026-08-23 (D-602) by escalating this family back to an error:
    # it STILL FIRES, 20 emissions over 4 of the 10 directories probed --
    # `test_beit` 4 (`beit_backbone/mask_token`), `test_video_jepa` 3
    # (`mask_token`), `test_byte_latent_transformer` 2 (`entropy_model/
    # token_embeddings`), `test_sam` 11 (`prompt_encoder/point_embeddings`,
    # `mask_downscaling`) -- every one of them a named, by-design-inert
    # component. The entry is earned, not inherited.
    "ignore:Gradients do not exist for variables:UserWarning",

    # DELETED 2026-08-23 -- plan-2026-08-23T091307-9a110062 / D-602. The two
    # spellings of the Keras "`build()` was called on layer X, however the layer
    # does not have a `build()` method implemented" family lived here, admitted
    # for 76 node ids of which 69 were the five model classes measured
    # un-materializable from their own `input_shape` (`video_jepa`, `lewm`,
    # `latent_gmm_registration`, `qwen`, `scunet`). All five now override
    # `build`, and `test_the_explicit_build_materializes_the_model.py`'s
    # `UNFIXED` table is EMPTY. Re-measured by escalating the family back to an
    # error: ZERO emissions across `tests/test_layers` (11,203 passed),
    # `test_constraints`, `test_initializers`, `test_datasets`, all five named
    # model packages, and eight oracle self-test files. The ONE surviving
    # provoker is `tests/test_models/test_lazy_build_contract_oracle.py`'s own
    # deliberately-build-less fixture, which now carries a module-scoped
    # `pytestmark` -- exactly what the rule above prescribes. Do NOT restore an
    # entry here for a single file's fixture.

    # tensorflow `python/data/ops/structured_function.py:258`, 3 node ids
    # (`tests/test_regularizers/`). TensorFlow states outright that
    # `run_functions_eagerly` cannot apply to tf.data functions. The tests set
    # it deliberately; no repo-side setting both keeps eager execution and
    # silences this. Unfixable here. RE-MEASURED 2026-08-23 (D-602): STILL
    # FIRES, and still exactly 3 node ids --
    # `test_soft_orthogonal.py::test_integration_with_keras_layer`,
    # `test_srip.py::test_regularization_effect`, `test_srip.py::test_training_step`.
    "ignore:Even though the .tf.config.experimental_run_functions_eagerly. option is set:UserWarning",

    # tensorflow `python/data/ops/dataset_ops.py:2341`, 1 node id
    # (`tests/test_train/test_bfunet/test_convunext_self_iterate.py`). Fires
    # when a seeded outer graph wraps an unseeded map fn; TF cannot tell whether
    # the capture was intended. Silencing it at the call site would mean seeding
    # a lambda whose determinism the test does not depend on. Unfixable here.
    # RE-MEASURED 2026-08-23 (D-602): STILL FIRES, and still exactly 1 node id,
    # `test_convunext_self_iterate.py::test_off_path_batch_contract`.
    "ignore:Seed .* from outer graph might be getting used by function:UserWarning",
]

[tool.pylint.main]
recursive = true
ignore = "CVS"
